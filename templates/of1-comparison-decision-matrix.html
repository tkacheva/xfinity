<main>
  <section class="of1-comparison-decision-matrix-hero of1-hero">
    <div class="hero-inner">
      <p class="eyebrow" data-slot="hero.eyebrow"></p>
      <h1 data-slot="hero.title"></h1>
      <p class="hero-sub" data-slot="hero.subtitle"></p>
      <a class="btn" data-slot="hero.cta" href="#"></a>
    </div>
  </section>

  <section class="of1-comparison-decision-matrix-matrix">
    <div class="matrix-inner">
      <h2 data-slot="matrix.title"></h2>
      <div class="matrix" role="table">
        <div class="mcell mhead col-a" role="columnheader" data-slot="matrix.col1"></div>
        <div class="mcell mhead col-b" role="columnheader" data-slot="matrix.col2"></div>
        <div class="mcell mhead col-c" role="columnheader" data-slot="matrix.col3"></div>

        <div class="mcell situation" role="rowheader" data-slot="row-1.situation"></div>
        <div class="mcell pick" data-slot="row-1.pick"></div>
        <div class="mcell why" data-slot="row-1.why"></div>

        <div class="mcell situation" role="rowheader" data-slot="row-2.situation"></div>
        <div class="mcell pick" data-slot="row-2.pick"></div>
        <div class="mcell why" data-slot="row-2.why"></div>

        <div class="mcell situation" role="rowheader" data-slot="row-3.situation"></div>
        <div class="mcell pick" data-slot="row-3.pick"></div>
        <div class="mcell why" data-slot="row-3.why"></div>

        <div class="mcell situation" role="rowheader" data-slot="row-4.situation"></div>
        <div class="mcell pick" data-slot="row-4.pick"></div>
        <div class="mcell why" data-slot="row-4.why"></div>

        <div class="mcell situation" role="rowheader" data-slot="row-5.situation"></div>
        <div class="mcell pick" data-slot="row-5.pick"></div>
        <div class="mcell why" data-slot="row-5.why"></div>
      </div>
    </div>
  </section>

  <section class="of1-comparison-decision-matrix-options">
    <div class="options-inner">
      <h2 data-slot="options.title"></h2>
      <div class="options-grid" data-grid-items>
        <article class="option-card" data-card="1">
          <img class="option-img" data-slot="item-1.image" src="" alt="" />
          <div class="option-body">
            <span class="option-tag" data-slot="item-1.tag"></span>
            <h3 data-slot="item-1.name"></h3>
            <p class="option-price" data-slot="item-1.price"></p>
            <p data-slot="item-1.body"></p>
            <a class="link" data-slot="item-1.cta" href="#"></a>
          </div>
        </article>
        <article class="option-card" data-card="2">
          <img class="option-img" data-slot="item-2.image" src="" alt="" />
          <div class="option-body">
            <span class="option-tag" data-slot="item-2.tag"></span>
            <h3 data-slot="item-2.name"></h3>
            <p class="option-price" data-slot="item-2.price"></p>
            <p data-slot="item-2.body"></p>
            <a class="link" data-slot="item-2.cta" href="#"></a>
          </div>
        </article>
        <article class="option-card" data-card="3">
          <img class="option-img" data-slot="item-3.image" src="" alt="" />
          <div class="option-body">
            <span class="option-tag" data-slot="item-3.tag"></span>
            <h3 data-slot="item-3.name"></h3>
            <p class="option-price" data-slot="item-3.price"></p>
            <p data-slot="item-3.body"></p>
            <a class="link" data-slot="item-3.cta" href="#"></a>
          </div>
        </article>
      </div>
    </div>
  </section>

  <section class="of1-comparison-decision-matrix-guide">
    <div class="guide-inner">
      <h2 data-slot="guide.title"></h2>
      <ul class="guide-list" data-slot-list="guide.items"></ul>
    </div>
  </section>

  <section class="of1-comparison-decision-matrix-cta">
    <div class="cta-inner">
      <h2 data-slot="cta.title"></h2>
      <p data-slot="cta.body"></p>
      <a class="btn" data-slot="cta.button" href="#"></a>
    </div>
  </section>
</main>
