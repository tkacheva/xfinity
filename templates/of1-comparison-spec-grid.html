<main>
  <section class="of1-comparison-spec-grid-hero of1-hero">
    <div class="hero-inner">
      <div class="hero-copy">
        <p class="eyebrow" data-slot="hero.eyebrow"></p>
        <h1 data-slot="hero.title"></h1>
        <p class="hero-sub" data-slot="hero.subtitle"></p>
        <a class="btn" data-slot="hero.cta" href="#"></a>
      </div>
      <img class="hero-img" data-slot="hero.image" src="" alt="" />
    </div>
  </section>

  <section class="of1-comparison-spec-grid-intro">
    <h2 data-slot="intro.title"></h2>
    <p data-slot="intro.body"></p>
  </section>

  <section class="of1-comparison-spec-grid-grid">
    <div class="spec-grid" role="table">
      <div class="cell corner" role="columnheader" data-slot="spec.corner"></div>
      <div class="cell head" role="columnheader">
        <span class="badge" data-slot="item-1.badge"></span>
        <span class="name" data-slot="item-1.name"></span>
      </div>
      <div class="cell head is-featured" role="columnheader">
        <span class="badge" data-slot="item-2.badge"></span>
        <span class="name" data-slot="item-2.name"></span>
      </div>
      <div class="cell head" role="columnheader">
        <span class="badge" data-slot="item-3.badge"></span>
        <span class="name" data-slot="item-3.name"></span>
      </div>

      <div class="cell rowlabel" role="rowheader" data-slot="spec.row1"></div>
      <div class="cell value" data-slot="item-1.speed"></div>
      <div class="cell value is-featured" data-slot="item-2.speed"></div>
      <div class="cell value" data-slot="item-3.speed"></div>

      <div class="cell rowlabel" role="rowheader" data-slot="spec.row2"></div>
      <div class="cell value price" data-slot="item-1.price"></div>
      <div class="cell value price is-featured" data-slot="item-2.price"></div>
      <div class="cell value price" data-slot="item-3.price"></div>

      <div class="cell rowlabel" role="rowheader" data-slot="spec.row3"></div>
      <div class="cell value" data-slot="item-1.data"></div>
      <div class="cell value is-featured" data-slot="item-2.data"></div>
      <div class="cell value" data-slot="item-3.data"></div>

      <div class="cell rowlabel" role="rowheader" data-slot="spec.row4"></div>
      <div class="cell value" data-slot="item-1.equipment"></div>
      <div class="cell value is-featured" data-slot="item-2.equipment"></div>
      <div class="cell value" data-slot="item-3.equipment"></div>

      <div class="cell rowlabel" role="rowheader" data-slot="spec.row5"></div>
      <div class="cell value" data-slot="item-1.mobile"></div>
      <div class="cell value is-featured" data-slot="item-2.mobile"></div>
      <div class="cell value" data-slot="item-3.mobile"></div>

      <div class="cell rowlabel" role="rowheader" data-slot="spec.row6"></div>
      <div class="cell value" data-slot="item-1.contract"></div>
      <div class="cell value is-featured" data-slot="item-2.contract"></div>
      <div class="cell value" data-slot="item-3.contract"></div>

      <div class="cell corner"></div>
      <div class="cell action"><a class="btn btn-outline" data-slot="item-1.cta" href="#"></a></div>
      <div class="cell action is-featured"><a class="btn" data-slot="item-2.cta" href="#"></a></div>
      <div class="cell action"><a class="btn btn-outline" data-slot="item-3.cta" href="#"></a></div>
    </div>
  </section>

  <section class="of1-comparison-spec-grid-diff">
    <h2 data-slot="diff.title"></h2>
    <div class="diff-grid">
      <article class="diff-card">
        <h3 data-slot="diff.c1title"></h3>
        <p data-slot="diff.c1body"></p>
      </article>
      <article class="diff-card">
        <h3 data-slot="diff.c2title"></h3>
        <p data-slot="diff.c2body"></p>
      </article>
      <article class="diff-card">
        <h3 data-slot="diff.c3title"></h3>
        <p data-slot="diff.c3body"></p>
      </article>
    </div>
  </section>

  <section class="of1-comparison-spec-grid-cta">
    <div class="cta-inner">
      <h2 data-slot="cta.title"></h2>
      <p data-slot="cta.body"></p>
      <a class="btn" data-slot="cta.button" href="#"></a>
    </div>
  </section>
</main>
